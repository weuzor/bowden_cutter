#####################################################################
# BOWDEN CUTTER – HARDWARE LAYER
#
# Defines the physical I/O for the Bowden Cutter subsystem.
#
# Scope:
#   - Servo actuator configuration
#   - Optional blade shuttle endstop
#
#####################################################################


#####################################################################
# SERVO ACTUATOR
#####################################################################
[servo bowden_cutter_actuator]

# MCU pin driving the servo signal
pin: PG12

# Full mechanical travel range of the servo [degrees]
maximum_servo_angle: 180

# Pulse width limits for the specific servo model [seconds]
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025

# Blade RELEASE position (safe, non-cutting state)
# This angle is treated as the "home" position by the core logic.
#
# NOTE:
#   This value should typically be set to approximately half of
#   the maximum_servo_angle. This provides sufficient travel range
#   in both directions for reliable cut motion and blade shuttle eject.
initial_angle: 100


#####################################################################
# BLADE SHUTTLE ENDSTOP (OPTIONAL)
#####################################################################
[gcode_button bowden_cutter_endstop]

  # Endstop signal pin
  #
  # Electrical behavior:
  #   The gcode_button is considered "PRESSED" when this pin is
  #   shorted to GND by the metallic idler wheel.
  #
  #   An internal pull-up is enabled so the pin reads HIGH when
  #   open (not shorted), and LOW when the endstop is closed.
  #
  #   The '!' inverts the logic so:
  #     - Open circuit  -> state = RELEASED
  #     - Short to GND  -> state = PRESSED

pin: ^!sb2209:PB9

press_gcode:
release_gcode:

  # NOTE:
  #   If no blade shuttle endstop is installed, comment out or remove
  #   this entire section. The core logic will automatically fall back
  #   to fixed-timing cut mode.


