#####################################################################
# BOWDEN CUTTER – SINGLE ENTRY INCLUDE
#
# This file is the only entry point that needs to be included
# in printer.cfg to enable the Bowden Cutter subsystem.
#
# It assembles the following layers:
#   1) Hardware layer      (I/O, servo, optional cut sensor)
#   2) Core logic layer   (cut control, validation, safety handling)
#   3) Integration layer (Happy Hare hook overrides)
#
# Usage:
#   Add the following line to your printer.cfg
#   AFTER Happy Hare has been included:
#
#     [include bowden_cutter.cfg]
#
#####################################################################


#####################################################################
# HARDWARE LAYER
#####################################################################
[include bc_hw.cfg]

#####################################################################
# CORE LOGIC
#####################################################################
[include bc_core.cfg]

#####################################################################
# HAPPY HARE INTEGRATION (OPTIONAL)
#
# This layer overrides Happy Hare cut hooks to route the physical
# cut operation through the Bowden Cutter core logic.
#
# If this include is commented out, Happy Hare remains completely
# unmodified and continues to use its native cutting backend.
#
# If Happy Hare is not used at all, this file can remain included
# without side effects.
#####################################################################
[include bc_mmu_overrides.cfg]
