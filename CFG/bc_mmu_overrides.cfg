#####################################################################
# BOWDEN CUTTER – HAPPY HARE CUT HOOK OVERRIDES
#
# Overrides the physical cutting backend used by Happy Hare's
# _MMU_CUT_TIP macro.
#
# Happy Hare delegates the physical cut operation to the following
# hook macros:
#   - _CUT_TIP_MOVE_TO_CUTTER_PIN
#   - _CUT_TIP_GANTRY_SERVO_DOWN
#   - _CUT_TIP_DO_CUT_MOTION
#   - _CUT_TIP_GANTRY_SERVO_UP
#
# The Bowden Cutter is an inline, self-contained cutting device and
# does NOT require toolhead movement, gantry servos, or external
# cutter pins.
#
# This file:
#   - Neutralizes all toolhead / gantry-related hooks (NO-OP)
#   - Delegates the actual cut to _BOWDEN_CUTTER_ACTION
#
# Scope:
#   Only the physical cut backend is overridden.
#   The _MMU_CUT_TIP macro and Happy Hare state machine remain
#   unchanged and continue to handle all filament logic.
#####################################################################


#####################################################################
# TOOLHEAD POSITIONING HOOK
#####################################################################
[gcode_macro _CUT_TIP_MOVE_TO_CUTTER_PIN]
# Called by Happy Hare to move the toolhead to a physical cutter pin.
# Not required for the Bowden Cutter.
gcode:
    ; Intentionally empty


#####################################################################
# GANTRY SERVO HOOK (DEPLOY)
#####################################################################
[gcode_macro _CUT_TIP_GANTRY_SERVO_DOWN]
# Called by Happy Hare to deploy a gantry- or toolhead-mounted cutter.
# Not required for the Bowden Cutter.
gcode:
    ; Intentionally empty


#####################################################################
# CUT EXECUTION HOOK
#####################################################################
[gcode_macro _CUT_TIP_DO_CUT_MOTION]
# Called by Happy Hare to perform the physical cut action.
# Delegates the operation to the Bowden Cutter core logic.
gcode:
    {% set vars = printer['gcode_macro _MMU_CUT_TIP_VARS'] %}
    {% set rip_speed = vars['rip_speed']|float %}
    {% set rip_length = vars['rip_length']|float %}

    _BOWDEN_CUTTER_ACTION RIP_LENGTH={rip_length} RIP_SPEED={rip_speed}


#####################################################################
# GANTRY SERVO HOOK (RETRACT)
#####################################################################
[gcode_macro _CUT_TIP_GANTRY_SERVO_UP]
# Called by Happy Hare to retract a gantry- or toolhead-mounted cutter.
# Not required for the Bowden Cutter.
gcode:
    ; Intentionally empty
