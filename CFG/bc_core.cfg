#####################################################################
# BOWDEN CUTTER – CORE LOGIC
#
# Physical cutting backend for the Bowden Cutter subsystem.
#
# Design Rationale:
#
# The cutting process is intentionally NOT controlled via configurable
# fixed servo cut positions because there is no reliable servo angle 
# at which a cut will always occur.
# This is a direct consequence of two fundamental properties of the system:
#
# 1) The Bowden cable is not rigid.
#    At low forces, the shuttle position does correlate with servo position,
#    as long as the system is in equilibrium between Bowden tension and the
#    shuttle return spring.
#
#    Once the blade contacts the filament and cutting force must be built up,
#    this equilibrium breaks down:
#      - forces in the Bowden cable increase significantly
#      - the Bowden cable exhibits longitudinal compliance
#      - compliance itself varies with temperature
#
#    In this regime, servo position no longer maps reliably to shuttle position.
#
# 2) The force required to cut filament is not constant.
#    It depends on the filament material and also varies with temperature.
#
# Because both the force generation (Bowden compliance under load) and the
# required cutting force are variable, a position-based approach cannot work.
#
# The cutting process is therefore force-driven rather than position-driven.
# The servo is driven toward its mechanical maximum and used purely as a
# force generator.
#
# Once the blade contacts the filament, the shuttle becomes mechanically
# blocked and further servo motion no longer results in shuttle movement.
# Servo motion is instead converted into stored energy via Bowden compliance,
# until the filament is severed and the stored energy is released.
#
# At the end of each cut cycle, the servo will intentionally stall for a short,
# controlled amount of time.
#
# This behavior is implemented in the time-based fallback mode:
#   - servo is driven to maximum output
#   - held for a defined duration
#   - then returned to neutral
#
# The fallback mode is robust and works reliably in practice,
# but does not provide explicit cut verification or fault detection.
#
# In normal operation with an active CUT sensor, the system becomes
# event-driven and self-adjusting:
#   - the cut is detected via the mechanical endstop
#   - servo stall time is reduced to the minimum required
#   - overall cycle time adapts automatically to the filament and temperature
#   - the cut is verified and therefore guaranteed
# 


#####################################################################
# MAIN CUT ACTION
#
[gcode_macro _BOWDEN_CUTTER_ACTION]

#====================================================================
# TUNABLE VARIABLES
#
# Reverse actuator servo [0|1]
# 0 = normal orientation, 1 = mechanically mirrored

variable_reverse_servo: 0

#--------------------------------------------------------------------
# NORMAL MODE SPECIFIC VARIABLES (CUT SENSOR INSTALLED)
#
# Blade shuttle evacuation time [ms]
# Time allowed for the servo to fully return the blade shuttle to its safe
# (neutral) position after the cut sensor releases. The macro will not finish
# before this delay has elapsed to prevent blade tip damage caused by
# premature filament movement.

variable_evac_time: 280

# Number of polling cycles allowed while waiting for the cut sensor to
# change state during cut or release. If this limit is reached, the cut
# operation is considered failed.

variable_max_polling_cycles: 10

# Note: the polling interval itself is not configurable.
# Instead, a G4 P1 + M400 sequence is used as the smallest reliable
# host-synchronized polling interval.
#
# G4 P1 ensures a new MCU command and time advance so that M400 does
# not become a no-op on subsequent iterations once the queue is empty.
# M400 then acts as a synchronization barrier, yielding the highest
# reliable polling resolution supported by the current system speed.

#--------------------------------------------------------------------
# FALLBACK MODE SPECIFIC VARIABLES (NO CUT SENSOR INSTALLED)
#
# Fixed cut time window [ms]
# Total time the servo is driven toward maximum output to complete the cut.
# This must be long enough to reliably sever the hardest filament in a
# cold state. The same time window is applied again for the return motion.

variable_fixed_cut_time_window: 1200

#====================================================================

gcode:
    SAVE_GCODE_STATE NAME=_BOWDEN_CUTTER_ACTION_STATE

    # Detect whether a cut sensor (electrically wired stop) is configured
    {% set cut_sensor_installed = "gcode_button bowden_cutter_endstop" in printer.configfile.settings %}

    # Resolve servo angles from hardware configuration
    {% set servo_cfg = printer.configfile.settings['servo bowden_cutter_actuator'] %}
    {% set pull_angle = 0 if reverse_servo|int > 0 else servo_cfg.maximum_servo_angle|int %}
    {% set release_angle = servo_cfg.initial_angle|int %}

    # Filament handling parameters (passed by caller / MMU layer)
    {% set rip_length = params.RIP_LENGTH|default(0.4)|float %}
    {% set rip_speed = params.RIP_SPEED|default(5)|float %}

    # Synchronize motion queue before mechanical action
    M400

    {% if cut_sensor_installed %}
    
        ### SENSOR-DRIVEN CUT MODE (NORMAL OPERATION) ###
        
        _BOWDEN_CUTTER_CUT N={max_polling_cycles} PULL_ANGLE={pull_angle} RIP_LENGTH={rip_length} RIP_SPEED={rip_speed}
        _BOWDEN_CUTTER_CHECK_CUT
        _BOWDEN_CUTTER_RELEASE N={max_polling_cycles} EVAC_TIME={evac_time} RIP_LENGTH={rip_length} RIP_SPEED={rip_speed}
        _BOWDEN_CUTTER_CHECK_RELEASE
        
    {% else %}

        ### FIXED-TIMING CUT MODE (FALLBACK) ###

        RESPOND TYPE=command MSG="BOWDEN_CUTTER: cutting"
        
        # Set actuator to max position
        SET_SERVO SERVO=bowden_cutter_actuator ANGLE={pull_angle}
        
        # Allow time to pass to complete the cut
        G4 P{fixed_cut_time_window}

        # Relieve force from the newly formed filament tip so the blade can
        # retract without side load while returning to its safe position.
        M83
        G1 E-{rip_length} F{rip_speed * 60}

        # Set actuator to release position (servo initial angle)
        SET_SERVO SERVO=bowden_cutter_actuator ANGLE={release_angle}

        # Allow time to pass for blade retract
        G4 P{fixed_cut_time_window|int}

        # Restore filament position
        G1 E{rip_length} F{rip_speed * 60}
        M82

        # Respond
        M400
        RESPOND TYPE=command MSG="BOWDEN_CUTTER: cut complete (not verified)"
    {% endif %}

    # Disable servo output after operation
    SET_SERVO SERVO=bowden_cutter_actuator WIDTH=0

    RESTORE_GCODE_STATE NAME=_BOWDEN_CUTTER_ACTION_STATE


#--------------------------------------------------------------------
# CUT PHASE
#
# Drives the actuator toward maximum output and polls until the
# cut sensor indicates that the cut is complete.
#
[gcode_macro _BOWDEN_CUTTER_CUT]
gcode:
    {% set pull_angle = params.PULL_ANGLE|default(0)|int %}
    {% set max_polling_cycles = [params.N|default(1)|int, 1]|max %}

    RESPOND TYPE=command MSG="BOWDEN_CUTTER: engaging blade"
    SET_SERVO SERVO=bowden_cutter_actuator ANGLE={pull_angle}

    {% for i in range(max_polling_cycles) %}
        _BOWDEN_CUTTER_CUT_DELAY
    {% endfor %}

#--------------------------------------------------------------------
# CUT PHASE DELAY
#
# Minimal actuator travel delay slice with sensor sampling.
# Allows the blade to advance while checking for cut completion.
#
[gcode_macro _BOWDEN_CUTTER_CUT_DELAY]
gcode:
    {% if printer['gcode_button bowden_cutter_endstop'].state != 'PRESSED' %}
        G4 P1
        M400
    {% endif %}

#--------------------------------------------------------------------
# CUT VALIDATION
#
# Verifies that the cut sensor was reached.
#
[gcode_macro _BOWDEN_CUTTER_CHECK_CUT]
gcode:
    {% if printer['gcode_button bowden_cutter_endstop'].state == 'PRESSED' %}
        RESPOND TYPE=command MSG="BOWDEN_CUTTER: cut successful"
    {% else %}
        RESPOND TYPE=error MSG="BOWDEN_CUTTER: cut failed"
        _BOWDEN_CUTTER_EXCEPTION
    {% endif %}

#--------------------------------------------------------------------
# RELEASE PHASE
#
[gcode_macro _BOWDEN_CUTTER_RELEASE]
gcode:
    {% set servo_cfg = printer.configfile.settings['servo bowden_cutter_actuator'] %}
    {% set release_angle = servo_cfg.initial_angle|int %}
    {% set max_polling_cycles = [params.N|default(1)|int, 1]|max %}
    {% set blade_evac_time = params.EVAC_TIME|default(150)|int %}
    {% set rip_length = params.RIP_LENGTH|default(0.4)|float %}
    {% set rip_speed = params.RIP_SPEED|default(5)|float %}

    RESPOND TYPE=command MSG="BOWDEN_CUTTER: releasing blade"

    # Relieve force from the newly formed filament tip so the blade can
    # retract without side load while returning to its safe position.
    M83
    G1 E-{rip_length} F{rip_speed * 60}

    # Set actuator to release position (servo initial angle)
    SET_SERVO SERVO=bowden_cutter_actuator ANGLE={release_angle}

    # Poll until the cut sensor reports open (equilibrium between
    # bowden tension and shuttle return spring is reached)
    {% for i in range(max_polling_cycles) %}
        _BOWDEN_CUTTER_RELEASE_DELAY
    {% endfor %}

    # Allow the blade to clear the filament path before restoring motion
    # to prevent blade tip damage
    G4 P{blade_evac_time}

    # Restore filament position
    G1 E{rip_length} F{rip_speed * 60}
    M82
    M400

#--------------------------------------------------------------------
# RELEASE PHASE DELAY
#
# Minimal actuator return delay slice with sensor sampling.
# Allows the blade to retract while checking for sensor release.
#
[gcode_macro _BOWDEN_CUTTER_RELEASE_DELAY]
gcode:
    {% if printer['gcode_button bowden_cutter_endstop'].state == 'PRESSED' %}
        G4 P1
        M400
    {% endif %}

#--------------------------------------------------------------------
# RELEASE VALIDATION
#
[gcode_macro _BOWDEN_CUTTER_CHECK_RELEASE]
gcode:
    {% if printer['gcode_button bowden_cutter_endstop'].state != 'PRESSED' %}
        RESPOND TYPE=command MSG="BOWDEN_CUTTER: blade released"
    {% else %}
        RESPOND TYPE=error MSG="BOWDEN_CUTTER: release failed"
        _BOWDEN_CUTTER_EXCEPTION
    {% endif %}

#--------------------------------------------------------------------
# ERROR HANDLING
#
[gcode_macro _BOWDEN_CUTTER_EXCEPTION]
gcode:
    {% set servo_cfg = printer.configfile.settings['servo bowden_cutter_actuator'] %}
    {% set release_angle = servo_cfg.initial_angle|int %}

    # Force blade to safe release position
    SET_SERVO SERVO=bowden_cutter_actuator ANGLE={release_angle}
    G4 P1000

    # Disable servo output
    SET_SERVO SERVO=bowden_cutter_actuator WIDTH=0

    {% if "gcode_macro MMU_PAUSE" in printer and printer.print_stats.state == "printing" %}
        MMU_PAUSE MSG="Bowden cutter error – check cutter before resuming"
    {% else %}
        RESPOND TYPE=error MSG="Bowden cutter error – check cutter"
    {% endif %}
